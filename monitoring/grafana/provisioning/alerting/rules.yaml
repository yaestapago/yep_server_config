# Generado por monitoring/grafana/generate.py — no editar a mano.
apiVersion: 1
groups:
- orgId: 1
  name: prod
  folder: Alertas
  interval: 1m
  rules:
  - uid: prod-api-down
    title: '[PROD] API caída'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max_over_time(probe_success{env="prod",service="api"}[1m])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 2m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      env: prod
    annotations:
      summary: La API de prod no responde en /health
      description: 'La sonda externa a https://api.yaestapago.co/health falla. Revisar: docker ps, docker logs api-prod, nginx.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-5xx-rate
    title: '[PROD] Tasa de errores 5xx alta'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({job="nginx_access", env="prod", status=~"5.."}[5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: B
        expr: sum(count_over_time({job="nginx_access", env="prod"}[5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: RA
      datasourceUid: __expr__
      model:
        refId: RA
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: RB
      datasourceUid: __expr__
      model:
        refId: RB
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $RA >= 5 && ($RA / ($RB + 0.0001)) > 0.05
    for: 2m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      env: prod
    annotations:
      summary: Más del 5% de las respuestas de prod son 5xx
      description: '{{ $values.RA }} errores 5xx de {{ $values.RB }} requests en los últimos 5 min. Ver tabla ''Endpoints con errores 5xx'' en el dashboard.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-app-errors
    title: '[PROD] Errores en logs de la API'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({container="api-prod"} |= `"level":"error"` [5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      env: prod
    annotations:
      summary: Más de 10 errores en logs de api-prod en 5 min
      description: '{{ $values.B }} líneas level=error en 5 min. Ver panel ''Errores y warnings de la API''.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-mem-limit
    title: '[PROD] Memoria de api-prod cerca del límite'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(container_memory_working_set_bytes{name="api-prod"}) / max(container_spec_memory_limit_bytes{name="api-prod"} > 0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.9
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      env: prod
    annotations:
      summary: api-prod usa más del 90% de su límite de memoria
      description: 'Uso actual: {{ humanizePercentage $values.B.Value }}. Si llega al 100% Docker lo mata (OOM).'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-crashloop
    title: '[PROD] api-prod reiniciándose'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(changes(container_start_time_seconds{name="api-prod"}[15m])) + count(count_over_time(container_start_time_seconds{name="api-prod"}[15m])) - 1
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 2
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      env: prod
    annotations:
      summary: api-prod se reinició varias veces en 15 min
      description: '{{ $values.B }} (re)inicios en 15 min: posible crash loop. Revisar docker logs.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-latency-p95
    title: '[PROD] Latencia p95 alta'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: quantile_over_time(0.95, {job="nginx_access", env="prod"} | json | path!~"/source-events/stream.*" | unwrap request_time [10m]) by ()
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      env: prod
    annotations:
      summary: El p95 de latencia de prod supera 3 s
      description: 'p95 actual: {{ $values.B }} s (10 min, sin SSE). Ver ''Endpoints más lentos''.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-no-traffic
    title: '[PROD] Sin tráfico'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({job="nginx_access", env="prod"}[30m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    for: 0s
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: warning
      env: prod
    annotations:
      summary: Prod no recibe requests desde hace 30 min
      description: Normalmente hay heartbeats de la app cada pocos segundos. Revisar Cloudflare/DNS/nginx.
      dashboard_url: https://grafana.yaestapago.co/d/yep-prod-http
    isPaused: false
  - uid: prod-auth-bruteforce
    title: '[PROD] Pico de 401 (posible fuerza bruta)'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({job="nginx_access", env="prod", status="401"}[5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 300
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      env: prod
    annotations:
      summary: Más de 300 respuestas 401 en 5 min en prod
      description: '{{ $values.B }} 401 en 5 min (normal < 110). Ver ''Top IPs'' y considerar regla WAF en Cloudflare.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
