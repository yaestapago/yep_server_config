- orgId: 1
  name: servidor
  folder: Alertas
  interval: 1m
  rules:
  - uid: host-cpu
    title: '[SERVIDOR] CPU alta'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: CPU del VPS > 85% por 10 min
      description: 'CPU: {{ $values.B }}%. Ver ''CPU por contenedor''.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: host-memory
    title: '[SERVIDOR] Memoria baja'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 10
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: Queda menos del 10% de RAM disponible
      description: 'Disponible: {{ $values.B }}%. El VPS no tiene swap: riesgo de OOM.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: host-disk-warning
    title: '[SERVIDOR] Disco / > 85%'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: El disco raíz supera el 85%
      description: 'Uso: {{ $values.B }}%. Liberar con `make clean` (imágenes Docker viejas).'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: host-disk-critical
    title: '[SERVIDOR] Disco / > 92%'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 92
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: El disco raíz supera el 92%
      description: 'Uso: {{ $values.B }}%. Con disco lleno se caen Mongo dumps, Loki, Docker y nginx.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: host-disk-fill-24h
    title: '[SERVIDOR] Disco se llena en < 24h'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}[6h], 86400)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 0
    for: 30m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
    annotations:
      summary: A este ritmo el disco raíz se llena en menos de 24 h
      description: 'Proyección de espacio libre a 24 h: {{ humanize1024 $values.B.Value }}B.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: tls-expiry
    title: '[SERVIDOR] Certificado TLS por vencer'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min((probe_ssl_earliest_cert_expiry - time()) / 86400)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
    for: 1h
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Un certificado TLS vence en menos de 14 días
      description: 'Días restantes: {{ $values.B }}.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: monitoring-target-down
    title: '[SERVIDOR] Componente de monitoreo caído'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: count(up == 0) or vector(0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Prometheus no puede scrapear algún target
      description: '{{ $values.B }} target(s) caídos. Ver tabla ''Targets de monitoreo''. `make mon-status`.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: ssh-login
    title: '[SEGURIDAD] Login SSH exitoso'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum by (user, ip) (count_over_time({job="auth"} |= "Accepted " | regexp `Accepted \S+ for (?P<user>\S+) from (?P<ip>\S+)` [5m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: info
    annotations:
      summary: 'Login SSH: {{ $labels.user }} desde {{ $labels.ip }}'
      description: Si no fuiste tú, cambia la contraseña y revisa `sudo grep Accepted /var/log/auth.log`.
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
  - uid: ssh-bruteforce
    title: '[SEGURIDAD] Fuerza bruta SSH masiva'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum(count_over_time({job="auth"} |~ "Failed password|Invalid user|authentication failure" [10m]))
        queryType: instant
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: replaceNN
          replaceWithValue: 0
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 500
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
    annotations:
      summary: Más de 500 intentos SSH fallidos en 10 min
      description: '{{ $values.B }} intentos. fail2ban debería estar baneando: `sudo fail2ban-client status sshd`.'
      dashboard_url: https://grafana.yaestapago.co/d/yep-server
    isPaused: false
