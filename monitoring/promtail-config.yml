server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Logs de contenedores Docker (api-prod, api-stage y demás) ───────────────
  # La API (NestJS) escribe JSON {"level":"log|warn|error",...,"context":"HTTP"};
  # el nivel se extrae en la query con `| json`, no como label.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nombre del contenedor sin el slash inicial
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Stream (stdout / stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      # Label env: extrae "prod"/"stage" de api-prod, piper-stage, etc.
      - source_labels: ['container']
        regex: '(?:api|piper)-(prod|stage)'
        target_label: 'env'
        replacement: '${1}'

  # ── Nginx access log (JSON, ver host/nginx/conf.d/10-yep-logging.conf) ─────
  # env = prod | stage | monitoring | unknown, según el Host del request.
  - job_name: nginx_access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_access
          __path__: /var/log/nginx/access_json.log
    pipeline_stages:
      - json:
          expressions:
            env: env
            method: method
            status: status
            time: time
      - labels:
          env:
          method:
          status:
      - timestamp:
          source: time
          format: RFC3339

  # ── Nginx error log ─────────────────────────────────────────────────────────
  - job_name: nginx_error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_error
          src: file
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})'
      - timestamp:
          source: ts
          format: '2006/01/02 15:04:05'

  # ── SSH / auth (intentos de login, sudo) ────────────────────────────────────
  # /var/log del host montado en /var/log/host (directorio, sobrevive a logrotate).
  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          src: file
          __path__: /var/log/host/auth.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\S+) \S+ (?P<program>[a-zA-Z0-9_.-]+)(?:\[\d+\])?:'
      - labels:
          program:
      - timestamp:
          source: ts
          format: RFC3339Nano

  # ── fail2ban (baneos) ───────────────────────────────────────────────────────
  - job_name: fail2ban
    static_configs:
      - targets: [localhost]
        labels:
          job: fail2ban
          src: file
          __path__: /var/log/host/fail2ban.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})'
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05,000'
