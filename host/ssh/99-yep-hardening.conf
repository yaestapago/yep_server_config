# Endurecimiento SSH. Instalado en /etc/ssh/sshd_config.d/.
# OJO: PasswordAuthentication sigue en 'yes' (50-cloud-init.conf) porque aún no
# hay llaves en ~/.ssh/authorized_keys. Cuando las haya, ver README (Seguridad).
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 3
