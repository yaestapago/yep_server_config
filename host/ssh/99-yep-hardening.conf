# Endurecimiento SSH. Instalado en /etc/ssh/sshd_config.d/.
# La autenticación (solo llaves, AllowUsers) vive en 00-yep-auth.conf, que gana
# a 50-cloud-init.conf. Aquí solo límites y endurecimiento general.
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 3
