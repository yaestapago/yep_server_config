# Autenticación SSH de YEP. Instalado en /etc/ssh/sshd_config.d/ y versionado
# en host/ssh/. Va como 00- porque sshd usa el PRIMER valor de cada opción y
# 50-cloud-init.conf fija "PasswordAuthentication yes".
# Solo llaves y solo los usuarios nombrados. ubuntu queda como cuenta de
# servicio sin SSH (su contraseña sirve solo para la consola KVM de OVH).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin no
AllowUsers carlosb leofu
