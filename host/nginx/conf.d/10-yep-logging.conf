# Log de acceso en JSON para Loki/Grafana. Instalado en /etc/nginx/conf.d/.
# $uri (sin query string) evita guardar tokens/tickets que viajan en la URL.

map $host $yep_env {
    api.yaestapago.co        prod;
    api-stage.yaestapago.co  stage;
    grafana.yaestapago.co    monitoring;
    default                  unknown;
}

log_format yep_json escape=json
    '{"time":"$time_iso8601","env":"$yep_env","host":"$host",'
    '"remote_addr":"$remote_addr","cf_ip":"$realip_remote_addr","country":"$http_cf_ipcountry",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","ua":"$http_user_agent","referer":"$http_referer",'
    '"origin":"$http_origin","cf_ray":"$http_cf_ray","proto":"$server_protocol"}';

access_log /var/log/nginx/access_json.log yep_json;
